name: Build ViP3R Sweet Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - NETHUNTER

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

      - name: Download Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Download GCC toolchains
        run: |
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 $HOME/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm $HOME/gcc32

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          make O=out ARCH=arm64 sweet_defconfig
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-elf- \
            CROSS_COMPILE_ARM32=arm-eabi- \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Package kernel with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=sweet/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sweetin/' anykernel.sh
          zip -r9 ../ViP3R-Sweet-Kernel-$(date +%Y%m%d).zip * -x "*.git*"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ViP3R-Sweet-Kernel
          path: ViP3R-Sweet-Kernel-*.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
